<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redress</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#F3EEE4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redress">
<style>
:root{--paper:#F3EEE4;--card:#FBF8F2;--ink:#1E2620;--muted:#6D6B60;--line:#E1D8C6;--moss:#2E5A3A;--moss2:#DCE5D4;--clay:#B9582F;--clay2:#F4DFD2;--sun:#C98F1E;--sun2:#F6E9C9;--plum:#6B4A7A;--plum2:#ECE1EF;--r:18px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
main{max-width:560px;margin:0 auto;padding:18px 18px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3,.serif{font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:34px;margin:2px 0 18px;line-height:1.08}
h2{font-size:21px;margin:30px 0 10px}
h3{font-size:17px;margin:0 0 4px}
p{margin:0 0 10px}
a{color:var(--moss)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.muted{color:var(--muted)}
.tiny{font-size:13px;color:var(--muted)}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{height:12px}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;background:var(--moss);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--moss);box-shadow:inset 0 0 0 1.5px var(--moss)}
.btn.soft{background:var(--moss2);color:var(--moss)}
.btn.clay{background:var(--clay)}
.btn.danger{background:transparent;color:var(--clay);box-shadow:inset 0 0 0 1.5px var(--clay)}
.btn.sm{padding:8px 13px;font-size:14px}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
select{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
input[type=text],input[type=search]{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--moss);outline-offset:1px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(251,248,242,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:11.5px;padding:6px 0;border-radius:12px}
nav.tabs svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--moss);font-weight:600}
/* weather */
.wx{display:flex;gap:16px;align-items:center}
.wx .t{font-family:ui-serif,"New York",Georgia,serif;font-size:46px;line-height:1;font-weight:600}
.wx .d{flex:1}
.wx .d b{display:block;font-size:17px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--moss2);color:var(--moss)}
.pill.rain{background:#DCE6F0;color:#2D5277}
/* thumbs */
.ph{aspect-ratio:4/5;border-radius:14px;background-size:cover;background-position:center;position:relative;overflow:hidden;background-color:#e9e2d4}
.ph.sw{box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);display:flex;align-items:flex-end;justify-content:flex-start;padding:8px}
.ph.sw span{font-size:11px;font-weight:600;background:rgba(251,248,242,.85);color:var(--ink);padding:2px 8px;border-radius:999px}
.ph.big{aspect-ratio:1/1;max-height:42vh;width:100%;margin-bottom:12px}
.ph.mini{width:52px;flex:none;border-radius:10px}
.ph.mini.sw span{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.it{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.it .nm{font-weight:600;font-size:14.5px;margin:7px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mt{font-size:12.5px;color:var(--muted);margin:1px 2px 0}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.b-propre{background:var(--moss2);color:var(--moss)}
.b-porte{background:var(--sun2);color:#7a560c}
.b-sale{background:var(--clay2);color:var(--clay)}
.b-reparer{background:var(--plum2);color:var(--plum)}
/* outfits */
.outfit .strip{display:flex;gap:8px;margin-bottom:12px}
.outfit .strip .ph{flex:1;min-width:0}
.outfit .strip .ph.sw span{display:none}
.ph.big.sw{aspect-ratio:5/2}
.outfit ul{margin:0 0 14px;padding:0;list-style:none;font-size:14.5px}
.outfit li{padding:3px 0;display:flex;justify-content:space-between;gap:8px}
.outfit li span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
.outfit .num{font-family:ui-serif,Georgia,serif;font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.yl{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.yl:first-of-type{border-top:0}
.yl .ph.mini{width:46px}
.yl .tx{flex:1;min-width:0}
.yl .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:ui-serif,Georgia,serif;font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:12px 0}
.stats3 b{display:block;font-family:ui-serif,Georgia,serif;font-size:22px}
.stats3 span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px}
.hlist{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.hlist::-webkit-scrollbar{display:none}
.hlist .it{width:118px;flex:none}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted)}
details[open] summary::after{content:"–"}
details p{margin:8px 0 0;font-size:14.5px;color:#3d443e}
/* form */
.photo-drop{display:block;border:2px dashed var(--line);border-radius:var(--r);background:var(--card);text-align:center;padding:14px;cursor:pointer}
.photo-drop .ph{max-width:220px;margin:0 auto}
.photo-drop .ph:not([style*=url]){display:none}
.photo-drop input{display:none}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--moss)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--ink)}
.stepper b{min-width:64px;text-align:center}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30}
#sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(30,38,32,.38)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .22s ease-out}
.sheet-card::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.chk{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--moss)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1}
.empty{text-align:center;padding:30px 10px}
.empty .serif{font-size:22px;margin-bottom:6px}
.notice{background:var(--sun2);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
code{background:#ece5d6;padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--moss);color:#fff;border:0;font-size:30px;line-height:58px;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(46,90,58,.35);z-index:9}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <a href="#matin" data-v="matin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Ce matin</a>
  <a href="#penderie" data-v="penderie"><svg viewBox="0 0 24 24"><path d="M12 6a2 2 0 1 1 2 2c-1 0-2 .7-2 1.6V10"/><path d="M12 10 3 16.5c-.8.6-.4 1.9.6 1.9h16.8c1 0 1.4-1.3.6-1.9L12 10Z"/></svg>Penderie</a>
  <a href="#ajout" data-v="ajout"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Ajouter</a>
  <a href="#bilan" data-v="bilan"><svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14Z"/><path d="M5 19 13 11"/></svg>Bilan</a>
</nav>
<div id="sheet" hidden></div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const z=n=>String(n).padStart(2,'0');
const todayKey=(d=new Date())=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const daysSince=k=>k?Math.round((Date.parse(todayKey())-Date.parse(k))/864e5):null;
const IN_PREVIEW=(()=>{try{return window.self!==window.top}catch(e){return true}})();
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- référentiels ---------- */
const CATS=[
 {id:'haut',label:'Haut',hint:'t-shirt, chemise, top',max:1},
 {id:'pull',label:'Pull',hint:'pull, sweat, gilet',max:3},
 {id:'bas',label:'Bas',hint:'pantalon, jean, jupe, short',max:5},
 {id:'robe',label:'Robe',hint:'robe, combinaison',max:2},
 {id:'veste',label:'Veste',hint:'veste, manteau, imper',max:20},
 {id:'chaussures',label:'Chaussures',hint:'',max:0},
];
const cat=id=>CATS.find(c=>c.id===id)||CATS[0];
const COLORS=[['noir','#1d1d1b'],['blanc','#f7f5f0'],['gris','#9a9a96'],['beige','#d9c7a6'],['marron','#7a5232'],['marine','#1f2f4f'],['bleu','#4a77b4'],['vert','#4f7a4a'],['kaki','#7b7a4a'],['rouge','#b7392e'],['bordeaux','#6e1f2b'],['rose','#e3a3ae'],['jaune','#e3be4a'],['orange','#d9783a'],['violet','#6b4f8c'],['motif','repeating-linear-gradient(45deg,#d9c7a6 0 8px,#2E5A3A 8px 16px)']];
const colorVal=n=>(COLORS.find(c=>c[0]===n)||COLORS[3])[1];
const WARMTH={1:'Léger',2:'Moyen',3:'Chaud'};
const STATES={propre:'Propre',porte:'Déjà porté',sale:'Au sale',reparer:'À réparer'};
const REASONS=[['donne','Donné à quelqu’un'],['vendu','Vendu (seconde main)'],['recyclerie','Déposé en recyclerie / ressourcerie'],['collecte','Borne textile (recyclage)'],['transforme','Transformé / upcyclé'],['jete','Jeté'],['perdu','Perdu']];
const BANDS={froid:{l:'Froid',r:'< 8°',f:4},frais:{l:'Frais',r:'8–15°',f:11},doux:{l:'Doux',r:'15–22°',f:18},chaud:{l:'Chaud',r:'≥ 22°',f:25}};
const bandOf=f=>f>=22?'chaud':f>=15?'doux':f>=8?'frais':'froid';
const WMO=c=>c===0?'Ciel clair':c<=2?'Éclaircies':c===3?'Couvert':c<=48?'Brouillard':c<=57?'Bruine':c<=67?'Pluie':c<=77?'Neige':c<=82?'Averses':c<=86?'Averses de neige':'Orage';
const REPAIRS=[
 ['Bouton décousu','Fil doublé, 6 à 8 passages dans les trous, puis enroule le fil sous le bouton pour former une petite tige avant le nœud au dos : il tiendra bien plus longtemps.'],
 ['Ourlet défait','Épingle à la bonne hauteur et reprends au point invisible (point de côté). En dépannage, une bande thermocollante au fer tient plusieurs lavages.'],
 ['Petit trou dans un pull','Point de reprise : tisse le fil en damier par-dessus le trou, ou assume une réparation visible avec une laine contrastée — c’est joli et ça se voit qu’on prend soin.'],
 ['Maille tirée / accroc','Ne coupe pas le fil ! Repousse-le à l’intérieur avec une aiguille à laine ou un petit crochet, puis détends doucement la maille autour.'],
 ['Fermeture éclair qui s’ouvre','Le curseur s’est souvent écarté : resserre-le très légèrement à la pince, des deux côtés. Si une dent manque, direction retoucheur.'],
 ['Bouloches','Un rasoir anti-bouloches ou un peigne à pull rend une seconde jeunesse au tricot. Lave ensuite sur l’envers, en cycle doux.'],
];

/* ---------- stockage local (IndexedDB, repli mémoire) ---------- */
const DB=(()=>{let db=null;const mem=new Map();
 async function open(){try{db=await new Promise((res,rej)=>{const r=indexedDB.open('penderie',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){db=null}}
 const st=m=>db.transaction('kv',m).objectStore('kv');
 function get(k){if(!db)return Promise.resolve(mem.get(k));return new Promise(res=>{try{const r=st('readonly').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(mem.get(k))}catch(e){res(mem.get(k))}})}
 function keys(){if(!db)return Promise.resolve([...mem.keys()]);return new Promise(res=>{try{const r=st('readonly').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>res([])}catch(e){res([])}})}
 function set(k,v){mem.set(k,v);if(!db)return;try{st('readwrite').put(v,k)}catch(e){}}
 function del(k){mem.delete(k);if(!db)return;try{st('readwrite').delete(k)}catch(e){}}
 return{open,get,set,del,keys,get ok(){return!!db}}})();

let S={v:1,items:[],log:[],pins:[],city:null,wx:null,manual:null,undo:null};
const photos=new Map();
const save=()=>DB.set('state',S);
const item=id=>S.items.find(i=>i.id===id);
const active=()=>S.items.filter(i=>!i.removed);
const maxOf=i=>i.max??cat(i.cat).max;

/* ---------- vignette ---------- */
function thumb(i,cls='ph',badge=false){
 const p=photos.get(i.id);const b=badge?`<span class="badge b-${i.state}">${STATES[i.state]}</span>`:'';
 if(p)return `<div class="${cls}" style="background-image:url('${p}')">${b}</div>`;
 return `<div class="${cls} sw" style="background:${colorVal(i.color)}">${b}<span>${esc(cat(i.cat).label)}</span></div>`;
}

/* ---------- météo ---------- */
let WX_LOADING=false,WX_FAIL=false;
function effWeather(){const t=todayKey();
 if(S.manual&&S.manual.date===t)return{band:S.manual.band,rain:S.manual.rain,feels:BANDS[S.manual.band].f,src:'manual'};
 if(S.wx&&S.wx.date===t)return{...S.wx,band:bandOf(S.wx.feels),src:'auto'};
 return null}
async function loadWeather(){
 if(!S.city||WX_LOADING)return;WX_LOADING=true;
 try{
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${S.city.lat}&longitude=${S.city.lon}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=1`;
  const j=await (await fetch(u)).json();const d=j.daily;
  const code=d.weather_code[0],rainP=d.precipitation_probability_max[0]??0;
  const feels=Math.round(d.apparent_temperature_max[0]*0.6+d.apparent_temperature_min[0]*0.4);
  S.wx={date:todayKey(),tmin:Math.round(d.temperature_2m_min[0]),tmax:Math.round(d.temperature_2m_max[0]),feels,rainP,code,rain:rainP>=50||(code>=51&&code<=67)||(code>=80&&code<=82)||code>=95};
  WX_FAIL=false;OUTS=null;save();
 }catch(e){WX_FAIL=true}
 WX_LOADING=false;if(VIEW==='matin')render();
}
async function setCity(name){
 if(!name.trim())return;
 try{const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=fr&format=json`)).json();
  const c=j.results&&j.results[0];if(!c){toast('Ville introuvable');return}
  // coordonnées arrondies (~1 km) : suffisant pour la météo, plus discret
  S.city={name:c.name,lat:+c.latitude.toFixed(2),lon:+c.longitude.toFixed(2)};S.wx=null;save();toast('Ville enregistrée : '+c.name);loadWeather();
 }catch(e){WX_FAIL=true;toast('Météo auto indisponible ici — choisis à la main.');render()}
}

/* ---------- proposition de tenues ---------- */
let OUTS=null;
function genOutfits(w){
 const avail=active().filter(i=>i.state==='propre'||i.state==='porte');
 const by=c=>avail.filter(i=>i.cat===c);
 const b=w.band,rain=!!w.rain,used=new Map();
 const pick=(c,want)=>{const list=by(c);if(!list.length)return null;
  const pin=list.find(i=>S.pins.includes(i.id));if(pin)return pin;
  let best=null,bs=-1e9;
  for(const i of list){
   let s=Math.random()*1.6;
   if(i.state==='porte')s+=1.5;                 // reporter avant de laver = moins de lessives
   if(i.boost)s+=4;                             // vêtement à remettre en avant
   const d=daysSince(i.lastWorn);
   if(d===null||d>45)s+=1.2;                    // faire vivre les oubliés
   if(d!==null&&d<2&&i.state!=='porte')s-=1;
   s-=Math.abs((i.warmth||2)-want)*1.3;
   if(rain&&i.waterproof&&(c==='veste'||c==='chaussures'))s+=3;
   s-=(used.get(i.id)||0)*2.5;                  // varier entre les 3 idées
   if(s>bs){bs=s;best=i}}
  return best};
 const outs=[],robes=by('robe');
 for(let k=0;k<3;k++){
  const o=[];
  const useRobe=robes.length&&(b==='chaud'||b==='doux')&&(k===1||!by('bas').length);
  if(useRobe)o.push(pick('robe',b==='chaud'?1:2));
  else{o.push(pick('haut',b==='chaud'?1:b==='froid'?2:1.5));o.push(pick('bas',b==='chaud'?1:b==='froid'?3:2))}
  if(b==='frais'||b==='froid'||(b==='doux'&&w.feels<18))o.push(pick('pull',b==='froid'?3:b==='doux'?1:2));
  if(b==='frais'||b==='froid'||rain)o.push(pick('veste',b==='froid'?3:b==='frais'?2:1));
  o.push(pick('chaussures',2));
  const items=o.filter(Boolean);items.forEach(i=>used.set(i.id,(used.get(i.id)||0)+1));
  if(items.length)outs.push(items.map(i=>i.id));
 }
 const seen=new Set();
 return outs.filter(o=>{const key=[...o].sort().join();if(seen.has(key))return false;seen.add(key);return true});
}

 <div class="row"><button class="btn sm ghost" data-a="edit" data-id="${i.id}">Modifier</button><button class="btn sm danger" data-a="removeAsk" data-id="${i.id}">Sortir de la penderie</button></div>`);
}

}

/* ---------- photo ---------- */
function compress(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
 img.onload=()=>{const M=640,s=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res({url:c.toDataURL('image/jpeg',.72),canvas:c})};
 img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

/* ---------- reconnaissance automatique (100 % sur l'appareil) ---------- */
// Couleur : simple calcul sur les pixels du centre de la photo, aucune IA.
const PAL=COLORS.filter(c=>c[0]!=='motif').map(([n,h])=>[n,[1,3,5].map(k=>parseInt(h.slice(k,k+2),16))]);
function detectColor(src){
 const N=40,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});
 x.drawImage(src,src.width*.25,src.height*.2,src.width*.5,src.height*.6,0,0,N,N);
 const d=x.getImageData(0,0,N,N).data,votes={};
 for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];let best=null,bd=1e12;
  for(const [n,[R,G,B]] of PAL){const rm=(r+R)/2;const dd=(2+rm/256)*(r-R)**2+4*(g-G)**2+(2+(255-rm)/256)*(b-B)**2;if(dd<bd){bd=dd;best=n}}
  votes[best]=(votes[best]||0)+1}
 const top=Object.entries(votes).sort((a,b)=>b[1]-a[1]);
 // deux couleurs très présentes et contrastées -> probablement un motif (rayures, carreaux)
 if(top[1]&&top[0][1]<N*N*.62&&top[1][1]>N*N*.22){const A=PAL.find(p=>p[0]===top[0][0])[1],B=PAL.find(p=>p[0]===top[1][0])[1];
  const lum=v=>.3*v[0]+.59*v[1]+.11*v[2];if(Math.abs(lum(A)-lum(B))>110)return 'motif'}
 return top[0][0];
}
// Type, matière, motif : modèle CLIP (vision + texte) qui tourne dans le navigateur, sur l'appareil.
// Téléchargé une seule fois depuis Hugging Face, puis gardé en cache. Aucune photo n'est envoyée.
const CLIP_ID='Xenova/clip-vit-base-patch32',TF_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';
const TYPES=[ // [anglais pour le modèle, catégorie, nom français, chaleur, imperméable]
 ['t-shirt','haut','T-shirt',1],['button-up shirt','haut','Chemise',1],['blouse','haut','Blouse',1],['tank top','haut','Débardeur',1],['polo shirt','haut','Polo',1],['long sleeve top','haut','Haut manches longues',2],
 ['knitted sweater','pull','Pull',2],['hoodie','pull','Sweat à capuche',2],['sweatshirt','pull','Sweat',2],['cardigan','pull','Gilet',2],['fleece jacket','pull','Polaire',3],
 ['jeans','bas','Jean',2],['trousers','bas','Pantalon',2],['shorts','bas','Short',1],['skirt','bas','Jupe',1],['leggings','bas','Legging',2],['sweatpants','bas','Jogging',2],
 ['dress','robe','Robe',1],['jumpsuit','robe','Combinaison',2],
 ['wool coat','veste','Manteau',3],['jacket','veste','Veste',2],['denim jacket','veste','Veste en jean',2],['blazer','veste','Blazer',2],['raincoat','veste','Imper',2,true],['puffer jacket','veste','Doudoune',3],['leather jacket','veste','Blouson cuir',2],['trench coat','veste','Trench',2,true],
 ['sneakers','chaussures','Baskets',2],['boots','chaussures','Bottines',3],['sandals','chaussures','Sandales',1],['dress shoes','chaussures','Chaussures de ville',2],['high heels','chaussures','Escarpins',1],['rain boots','chaussures','Bottes de pluie',2,true],
];
const MATS=[['wool','en laine',1],['cotton','en coton',0],['linen','en lin',-1],['denim','en jean',0],['leather','en cuir',0],['fleece','polaire',1],['silk','en soie',-1],['synthetic polyester','synthétique',0]];
const PATS=[['plain solid color',''],['striped','rayé'],['plaid checkered','à carreaux'],['floral print','fleuri'],['polka dot','à pois'],['graphic print','imprimé']];
let AI=null,AI_LOADING=null,AI_MSG='';
function aiMsg(m){AI_MSG=m;const el=$('#aistat');if(el)el.textContent=m}
const norm=v=>{let n=0;for(const x of v)n+=x*x;n=Math.sqrt(n)||1;return Float32Array.from(v,x=>x/n)};
const dot=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s};
function aiLoad(){
 if(AI)return Promise.resolve(AI);
 if(!AI_LOADING)AI_LOADING=(async()=>{
  const T=await import(TF_URL);T.env.allowLocalModels=false;
  const files={};let last=0;
  const progress_callback=p=>{if(p.status==='progress'&&p.total){files[p.file]=[p.loaded,p.total];const L=Object.values(files).reduce((a,b)=>a+b[0],0),Tt=Object.values(files).reduce((a,b)=>a+b[1],0);
   const now=Date.now();if(now-last>400){last=now;aiMsg(`Téléchargement du modèle : ${Math.round(L/1048576)} / ${Math.round(Tt/1048576)} Mo`)}}};
  // Les « étiquettes » texte ne se calculent qu'une fois, puis sont gardées sur l'appareil.
  let txt=await DB.get('clip-text-v1');
  if(!txt){
   aiMsg('Préparation du modèle…');
   const tok=await T.AutoTokenizer.from_pretrained(CLIP_ID,{progress_callback});
   const tm=await T.CLIPTextModelWithProjection.from_pretrained(CLIP_ID,{dtype:'q8',progress_callback});
   const enc=async list=>{const {text_embeds}=await tm(tok(list,{padding:true,truncation:true}));const d=text_embeds.dims[1];return list.map((_,i)=>Array.from(norm(text_embeds.data.slice(i*d,(i+1)*d))))};
   txt={types:await enc(TYPES.map(t=>`a photo of a ${t[0]}, a piece of clothing`)),mats:await enc(MATS.map(m=>`a close-up photo of clothing made of ${m[0]}`)),pats:await enc(PATS.map(p=>`a photo of a ${p[0]} piece of clothing`))};
   txt.types=txt.types.map(a=>Float32Array.from(a));DB.set('clip-text-v1',{types:txt.types.map(a=>Array.from(a)),mats:txt.mats,pats:txt.pats});
   try{await tm.dispose()}catch(e){}
  }
  const conv=a=>a.map(v=>v instanceof Float32Array?v:Float32Array.from(v));
  const proc=await T.AutoProcessor.from_pretrained(CLIP_ID,{progress_callback});
  const vm=await T.CLIPVisionModelWithProjection.from_pretrained(CLIP_ID,{dtype:'q8',progress_callback});
  AI={T,proc,vm,txt:{types:conv(txt.types),mats:conv(txt.mats),pats:conv(txt.pats)}};aiMsg('Modèle prêt — tout se passe sur ton téléphone.');return AI})()
  .catch(e=>{AI_LOADING=null;aiMsg('');throw e});
 return AI_LOADING}
function softmax(sims){const m=Math.max(...sims);const ex=sims.map(s=>Math.exp(100*(s-m)));const t=ex.reduce((a,b)=>a+b,0);return ex.map(e=>e/t)}
const best=p=>p.reduce((b,v,i)=>v>p[b]?i:b,0);
async function aiGuess(canvas){
 const ai=await aiLoad();
 const img=await ai.T.RawImage.fromURL(canvas.toDataURL('image/jpeg',.9));
 const {image_embeds}=await ai.vm(await ai.proc(img));const v=norm(image_embeds.data);
 const pt=softmax(ai.txt.types.map(t=>dot(v,t))),pm=softmax(ai.txt.mats.map(t=>dot(v,t))),pp=softmax(ai.txt.pats.map(t=>dot(v,t)));
 // on regroupe les probabilités par catégorie pour décider du type
 const byCat={};TYPES.forEach((t,i)=>byCat[t[1]]=(byCat[t[1]]||0)+pt[i]);
 const c=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];if(c[1]<.35)return null;
 let ti=-1,tv=-1;TYPES.forEach((t,i)=>{if(t[1]===c[0]&&pt[i]>tv){tv=pt[i];ti=i}});
 const t=TYPES[ti],mi=best(pm),pi=best(pp);
 const mat=pm[mi]>.5?MATS[mi]:null,pat=pi>0&&pp[pi]>.5?PATS[pi]:null;
 let noun=t[2];if(mat&&!noun.toLowerCase().includes(mat[1].replace(/^en /,'')))noun+=' '+mat[1];if(pat)noun+=' '+pat[1];
 return{cat:t[1],noun,warmth:Math.max(1,Math.min(3,t[3]+(mat?mat[2]:0))),waterproof:!!t[4],motif:!!pat,conf:c[1]};
}
async function analyze(file){
 const {url,canvas}=await compress(file);const r={photo:url,color:detectColor(canvas)};
 if(S.ai){try{const g=await aiGuess(canvas);if(g){Object.assign(r,g);if(g.motif)r.color='motif'}}catch(e){console.warn(e);r.aiErr=true}}
 return r;
}

 wxBand(el){const t=todayKey();const m=S.manual&&S.manual.date===t?S.manual:{date:t,rain:false};m.band=el.dataset.v;S.manual=m;OUTS=null;save();closeSheet();render()},
 wxRain(){const t=todayKey();const m=S.manual&&S.manual.date===t?S.manual:{date:t,band:effWeather()?.band||'doux'};m.rain=!m.rain;if(!m.band)m.band='doux';S.manual=m;OUTS=null;save();closeSheet();render()},
 wxAuto(){S.manual=null;OUTS=null;save();closeSheet();render()},

 wearOutfit(el){const o=OUTS&&OUTS[+el.dataset.k];if(!o)return;wear(o);render();window.scrollTo({top:0,behavior:'smooth'});toast('Tenue enregistrée 🌿')},

 unpin(el){S.pins=S.pins.filter(x=>x!==el.dataset.id);OUTS=null;save();render()},
 toWash(el){const i=item(el.dataset.id);i.state='sale';S.pins=S.pins.filter(x=>x!==i.id);OUTS=null;save();render()},
 stillOk(el){const i=item(el.dataset.id);i.state='porte';OUTS=null;save();render()},
 fCat(el){F.cat=el.dataset.v;render()},
 fState(el){F.state=el.dataset.v;render()},
 open(el){itemSheet(el.dataset.id)},
 setState(el){const i=item(el.dataset.id);i.state=el.dataset.v;if(i.state==='propre')i.sinceWash=0;if(i.state==='sale'||i.state==='reparer')S.pins=S.pins.filter(x=>x!==i.id);OUTS=null;save();itemSheet(i.id);if(VIEW!=='ajout')render()},
 boost(el){const i=item(el.dataset.id);i.boost=true;OUTS=null;save();closeSheet();render();toast('Il sera proposé en priorité')},
 edit(el){EDIT=el.dataset.id;DR=null;closeSheet();if(location.hash==='#ajout')render();else location.hash='ajout'},
 cancelEdit(){EDIT=null;DR=null;location.hash='penderie'},
 removeAsk(el){removeSheet(el.dataset.id)},
 removeDo(el){const i=item(el.dataset.id);i.removed={date:todayKey(),reason:el.dataset.v};S.pins=S.pins.filter(x=>x!==i.id);OUTS=null;save();closeSheet();render();toast(['jete','perdu'].includes(el.dataset.v)?'Retiré de la penderie':'Merci pour sa seconde vie ♻︎')},
 deleteDo(el){const id=el.dataset.id;S.items=S.items.filter(i=>i.id!==id);S.log.forEach(l=>l.ids=l.ids.filter(x=>x!==id));photos.delete(id);DB.del('photo:'+id);OUTS=null;save();closeSheet();render()},
 washOpen:washSheet,
 batchDrop(el){BATCH.items.splice(+el.dataset.k,1);if(!BATCH.items.length)BATCH=null;render()},
 batchCancel(){BATCH=null;render()},
 batchSave(){
  document.querySelectorAll('[data-bi]').forEach(f=>{const b=BATCH.items[+f.dataset.bi];if(b)b[f.dataset.bf]=f.value});
  for(const b of BATCH.items){const id=uid();
   S.items.push({id,name:b.name.trim()||`${cat(b.cat).label} ${b.color}`,cat:b.cat,color:b.color,warmth:b.warmth||2,waterproof:!!b.waterproof,secondHand:false,state:'propre',max:null,added:todayKey(),wears:0,sinceWash:0,lastWorn:null});
   photos.set(id,b.photo);DB.set('photo:'+id,b.photo)}
  const n=BATCH.items.length;BATCH=null;OUTS=null;save();toast(n+' vêtements ajoutés');location.hash='penderie'},
 washDo(){document.querySelectorAll('#sheet input[type=checkbox]:checked').forEach(c=>{const i=item(c.value);i.state='propre';i.sinceWash=0});OUTS=null;save();closeSheet();render();toast('Tout beau tout propre')},
 dr(el){DR.touched={...(DR.touched||{}),[el.dataset.k]:true};DR[el.dataset.k]=el.dataset.k==='warmth'?+el.dataset.v:el.dataset.v;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));if(el.dataset.k==='cat'){DR.max=null;$('#maxv').textContent=fmtMax()}},
 maxDec(){const m=DR.max??cat(DR.cat).max;DR.max=Math.max(0,m-1);$('#maxv').textContent=fmtMax()},
 maxInc(){const m=DR.max??cat(DR.cat).max;DR.max=Math.min(30,m+1);$('#maxv').textContent=fmtMax()},
 saveItem(el){
  DR.name=$('#nm').value.trim()||`${cat(DR.cat).label} ${DR.color}`;DR.waterproof=$('#wp').checked;DR.secondHand=$('#sh').checked;
  const {photo,touched,detected,...data}=DR;

  const id=EDIT||data.id;
  if(photo){photos.set(id,photo);DB.set('photo:'+id,photo)}

  if(el.dataset.more){render();window.scrollTo({top:0});toast('« '+name+' » ajouté')}
  else{toast('Enregistré');location.hash='penderie'}
 },
 export(){
  const data=JSON.stringify({app:'penderie',v:1,date:todayKey(),state:S,photos:Object.fromEntries(photos)});
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`redress-${todayKey()}.json`;document.body.appendChild(a);a.click();a.remove();toast('Sauvegarde téléchargée')}catch(e){toast('Export impossible ici')}
 },
 wipeAsk(){sheet(`<h2 style="margin-top:0">Tout effacer ?</h2><p>Vêtements, photos et historique seront supprimés de cet appareil. Pense à sauvegarder avant.</p><button class="btn clay block" data-a="wipeDo">Oui, tout effacer</button><div class="spacer"></div><button class="btn ghost block" data-a="close">Annuler</button>`)},

document.addEventListener('change',async e=>{
 if(e.target.id==='pic'&&e.target.files[0]){
  DR.name=$('#nm').value;DR.waterproof=$('#wp').checked;DR.secondHand=$('#sh').checked;
  if(S.ai&&!AI)toast('Analyse…');

 if(e.target.id==='imp'&&e.target.files[0]){try{const j=JSON.parse(await e.target.files[0].text());if(j.app!=='penderie')throw 0;
